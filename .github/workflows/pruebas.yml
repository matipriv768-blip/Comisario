name: Pruebas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lupa
      - run: python3 test/check_i18n.py apps/lua/Comisario/Comisario.lua
      - run: python3 test/run_tests.py apps/lua/Comisario/Comisario.lua
      - run: python3 test/run_online.py apps/lua/Comisario/Comisario.lua
      - run: python3 test/run_server.py servidor/comisario_servidor.lua
