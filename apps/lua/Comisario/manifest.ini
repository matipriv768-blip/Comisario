[ABOUT]
NAME = Comisario
AUTHOR = Matias
VERSION = 1.6.2
DESCRIPTION = Comisario de carrera: limites de pista, contactos, puntos de incidente y sanciones reales para ti y para la IA. Offline y online.
REQUIRED_VERSION = 0

[CORE]
LAZY = NONE

[UI_CALLBACKS]
IN_GAME = fullscreenUI

[WINDOW_...]
ID = main
NAME = Comisario
ICON = icon.png
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
SIZE = 420, 320
MIN_SIZE = 320, 160
FLAGS = SETTINGS

[WINDOW_...]
ID = standings
NAME = Comisario: clasificacion
ICON = icon.png
FUNCTION_MAIN = windowStandings
SIZE = 440, 420
MIN_SIZE = 380, 160

[WINDOW_...]
ID = hud_msg
NAME = Comisario: aviso
ICON = icon.png
FUNCTION_MAIN = windowHudMessage
SIZE = 700, 80
MIN_SIZE = 120, 40
FLAGS = FLOATING_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE

[WINDOW_...]
ID = hud_pen
NAME = Comisario: sancion
ICON = icon.png
FUNCTION_MAIN = windowHudPenalty
SIZE = 460, 124
MIN_SIZE = 120, 40
FLAGS = FLOATING_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE

[WINDOW_...]
ID = hud_status
NAME = Comisario: estado
ICON = icon.png
FUNCTION_MAIN = windowHudStatus
SIZE = 700, 50
MIN_SIZE = 100, 30
FLAGS = FLOATING_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE

[WINDOW_...]
ID = hud_start
NAME = Comisario: largada
ICON = icon.png
FUNCTION_MAIN = windowHudStart
SIZE = 350, 160
